# Weekly updates. Minor and patch updates come in one grouped PR so the queue
# stays small; majors come one by one, because they need a read.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Majors for these packages are migrations. Open a PR by hand, with the matching peers.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: vitest
        update-types: ['version-update:semver-major']
      # esbuild 0.x minors can change the served bundle; bump it by hand as an SDK release.
      - dependency-name: esbuild
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
