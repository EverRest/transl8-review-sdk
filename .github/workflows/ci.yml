name: CI

on:
  push:
  pull_request:

env:
  NODE_VERSION: '22'

jobs:
  ci:
    name: Typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Runs scripts/verify-dist.mjs, so a bundle that builds but ships the
      # wrong shape fails here rather than at publish time.
      - name: Build
        run: npm run build

      # The IIFE bundle is minified and carries no sourceMappingURL. The map
      # still exists (esbuild's `sourcemap: 'external'`) so a customer's
      # minified stack trace can be symbolicated offline; this is the one
      # place it is kept, addressed by the exact SDK build that produced it.
      - name: Read SDK version
        id: sdk-version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Upload sourcemap artifact
        uses: actions/upload-artifact@v5
        with:
          name: review-sdk-sourcemap-${{ steps.sdk-version.outputs.version }}
          path: dist/index.global.js.map
          retention-days: 90
