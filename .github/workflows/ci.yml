name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  ci:
    name: Typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Only what we ship. html2canvas is the one runtime dependency, and it
      # runs inside customer pages. Dev-only advisories are Dependabot's.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Runs scripts/verify-dist.mjs, so a bundle that builds but ships the
      # wrong shape fails here rather than at publish time.
      - name: Build
        run: npm run build

      # The IIFE bundle is minified and carries no sourceMappingURL. The map
      # still exists (esbuild's `sourcemap: 'external'`) so a customer's
      # minified stack trace can be symbolicated offline; this is the one
      # place it is kept, addressed by the exact SDK build that produced it.
      - name: Read SDK version
        id: sdk-version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Upload sourcemap artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: review-sdk-sourcemap-${{ steps.sdk-version.outputs.version }}
          path: dist/index.global.js.map
          retention-days: 90
