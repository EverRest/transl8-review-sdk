name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  ci:
    name: Typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Only what we ship. html2canvas is the one runtime dependency, and it
      # runs inside customer pages. Dev-only advisories are Dependabot's.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Runs scripts/verify-dist.mjs, so a bundle that builds but ships the
      # wrong shape fails here rather than at publish time.
      - name: Build
        run: npm run build

      # The IIFE bundle is minified and carries no sourceMappingURL. The map
      # still exists (esbuild's `sourcemap: 'external'`) so a customer's
      # minified stack trace can be symbolicated offline; this is the one
      # place it is kept, addressed by the exact SDK build that produced it.
      - name: Read SDK version
        id: sdk-version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Upload sourcemap artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-sdk-sourcemap-${{ steps.sdk-version.outputs.version }}
          path: dist/index.global.js.map
          retention-days: 90
